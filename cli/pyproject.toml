[project]
name = "zentrainer-cli"
version = "0.1.0"
description = "zt: set up, run, update and watch ZenTrainer from a terminal."
requires-python = ">=3.10"
dependencies = [
  "rich>=13.7",
  "questionary>=2.0",
  "textual>=1.0",
]

[project.scripts]
zt = "zt.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zt"]
