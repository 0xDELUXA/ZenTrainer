<!doctype html>
<!-- README and Registry banner. The panels are real crops of the app (maroon-volt, dark) on demo
     content: python docs/banner/shots.py retakes them, python docs/banner/render.py renders this
     to docs/images/banner.webp (and the Registry icon, docs/images/icon.png). -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: #211927;
    --deep: #1a1320;
    --text: #f4eef7;
    --muted: #bcaecb;
    --accent: #f0ff41;
    --border: #473655;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  .banner {
    position: relative;
    width: 1600px;
    height: 800px;
    overflow: hidden;
    border-radius: 32px;
    background:
      radial-gradient(1000px 700px at 80% 25%, #3a2747 0%, transparent 70%),
      radial-gradient(800px 500px at 100% 100%, #2d1f38 0%, transparent 70%),
      linear-gradient(120deg, var(--deep) 0%, var(--bg) 45%, #2a1d33 100%);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text);
  }
  .copy {
    position: absolute;
    left: 88px;
    top: 0;
    bottom: 0;
    width: 560px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    z-index: 5;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand svg { width: 52px; height: 37px; }
  .eyebrow {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.02em;
    color: var(--accent);
  }
  h1 {
    margin: 10px 0 0;
    font-family: 'Inter Display', 'Inter', sans-serif;
    font-size: 116px;
    font-weight: 700;
    letter-spacing: -0.035em;
    line-height: 1;
  }
  .rule {
    width: 104px;
    height: 6px;
    margin: 34px 0 30px;
    border-radius: 3px;
    background: var(--accent);
  }
  .tagline {
    margin: 0;
    font-size: 32px;
    line-height: 1.3;
    color: var(--muted);
    font-weight: 400;
  }
  .pills { display: flex; gap: 12px; margin-top: 34px; }
  .pill {
    padding: 9px 18px;
    border: 1.5px solid var(--accent);
    border-radius: 999px;
    font-size: 20px;
    font-weight: 500;
    color: var(--accent);
  }
  .pill.dim { border-color: var(--border); color: var(--muted); }

  /* the app: the dataset page behind, the run in front of its lower-left corner */
  .stage { position: absolute; inset: 0; perspective: 2400px; }
  .panel {
    position: absolute;
    display: block;
    border-radius: 16px;
    box-shadow: 0 40px 90px -24px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.05);
  }
  .label {
    position: absolute;
    padding: 4px 10px;
    margin-left: -10px;
    border-radius: 8px;
    background: rgba(26, 19, 32, 0.88);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.08em;
  }
  .dataset { left: 760px; top: 110px; width: 800px; transform: rotateY(-9deg); transform-origin: right center; }
  .dataset-label { left: 772px; top: 70px; color: var(--muted); }
  .run { left: 680px; top: 400px; width: 560px; transform: rotateY(-9deg); transform-origin: left center; }
  .run-label { left: 690px; top: 360px; color: var(--accent); z-index: 3; }
  .chart { left: 1130px; top: 610px; width: 430px; transform: rotateY(-9deg); transform-origin: left center; }
  .fade {
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    background: linear-gradient(180deg, transparent 88%, rgba(33, 25, 39, 0.9) 100%);
  }
</style>
</head>
<body>
  <div class="banner">
    <div class="copy">
      <div class="brand">
        <svg viewBox="-12 4 88 62" aria-hidden="true"><g transform="translate(32 58) scale(0.66)" fill="#f0ff41">
          <path d="M0,0 C24,-16.2 16.8,-42.12 0,-54 C-16.8,-42.12 -24,-16.2 0,0Z" transform="rotate(-70)" opacity="0.4"/>
          <path d="M0,0 C24,-16.2 16.8,-42.12 0,-54 C-16.8,-42.12 -24,-16.2 0,0Z" transform="rotate(70)" opacity="0.4"/>
          <path d="M0,0 C26,-19.8 18.2,-51.48 0,-66 C-18.2,-51.48 -26,-19.8 0,0Z" transform="rotate(-36)" opacity="0.7"/>
          <path d="M0,0 C26,-19.8 18.2,-51.48 0,-66 C-18.2,-51.48 -26,-19.8 0,0Z" transform="rotate(36)" opacity="0.7"/>
          <path d="M0,0 C28,-23.4 19.6,-60.84 0,-78 C-19.6,-60.84 -28,-23.4 0,0Z"/>
        </g></svg>
        <div class="eyebrow">NYNXZ</div>
      </div>
      <h1>ZenTrainer</h1>
      <div class="rule"></div>
      <p class="tagline">Train LoRAs inside ComfyUI,<br />and watch them learn</p>
      <div class="pills">
        <span class="pill">Characters · Styles · Video</span>
        <span class="pill dim">Your ComfyUI models</span>
      </div>
    </div>

    <div class="stage">
      <span class="label dataset-label">DATASETS</span>
      <img class="panel dataset" src="el-dataset.png" alt="" />
      <span class="label run-label">TRAINING</span>
      <img class="panel run" src="el-samples.png" alt="" />
      <img class="panel chart" src="el-loss.png" alt="" />
    </div>
    <div class="fade"></div>
  </div>
</body>
</html>
