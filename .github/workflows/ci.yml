name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The harness tests need no ComfyUI and no GPU; the CPU torch wheel keeps this quick.
      - run: >
          uv run --no-project --index https://download.pytorch.org/whl/cpu
          --with pytest --with torch --with pillow --with numpy --with av --with safetensors
          python -m pytest -q tests

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # type-checks, then builds: what the Registry archive ships
      - run: pnpm build
