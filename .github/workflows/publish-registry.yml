name: publish-registry

# Build the app and publish ZenTrainer to the ComfyUI registry. web/dist is gitignored and
# picked up via `[tool.comfy] includes = ["web/dist", "engine/js"]`.
on:
  # A v* tag publishes; a manual run is for a retry.
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: The tag names the version being published
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          test "$want" = "$have" || { echo "tag $GITHUB_REF_NAME, but pyproject.toml is $have"; exit 1; }

      - name: Build the app
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          test -f dist/index.html

      # comfy-cli archives git-TRACKED files only, and web/dist is gitignored. Staging is
      # enough: `git ls-files` lists the index, so nothing is committed or pushed.
      - run: git add -f web/dist

      - run: pip install comfy-cli

      - name: Publish to the ComfyUI registry
        run: comfy node publish --token "$REGISTRY_TOKEN"
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
